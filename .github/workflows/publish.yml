# Publishes drivedeck to npm when a version tag (v1.2.3) is pushed.
#
# There is no npm token anywhere: npm trusts this exact workflow file through
# OIDC ("trusted publishing") and attaches a signed provenance statement that
# links each release to the commit and workflow run that built it.
name: Publish to npm

on:
  push:
    tags: ['v*.*.*']

permissions: {}

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'rashidul-hasan/drivedeck'
    runs-on: ubuntu-latest
    # Protected environment: a maintainer must approve the run before it can publish.
    environment: npm
    permissions:
      contents: read
      id-token: write # lets npm verify this workflow; nothing else
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Only release commits that are on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME points at a commit that is not on main"
            exit 1
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Check npm supports trusted publishing (11.5.1 or later)
        run: |
          node -e '
            const v = process.argv[1].split(".").map(Number);
            const ok = v[0] > 11 || (v[0] === 11 && (v[1] > 5 || (v[1] === 5 && v[2] >= 1)));
            if (!ok) { console.error("npm " + process.argv[1] + " is too old for trusted publishing"); process.exit(1); }
          ' "$(npm --version)"

      - run: npm run check

      # prepublishOnly re-runs the checks with --release (tag must match the version).
      - run: npm publish
