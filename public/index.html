<div class="shell">
 <aside class="side" id="side">
  <div class="brand">

   <div id="drives" class="drives"></div>
   <button class="add-drive" id="bAdd"><span class="nav-ico"><svg><use href="#i-plus"/></svg></span><span>Add drive</span></button>
  </nav>
  <div class="side-links"><button class="nav-item" id="navSettings"><span class="nav-ico"><svg><use href="#i-settings"/></svg></span><span>Settings</span></button></div>
